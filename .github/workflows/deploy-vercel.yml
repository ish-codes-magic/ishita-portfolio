name: Deploy release to Vercel

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Check, build, and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf '::error::Use a release tag such as v1.0.0.\n'
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            printf '::error::Release tags must point to a commit on main.\n'
            exit 1
          fi

      - name: Check Vercel configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          : "${VERCEL_TOKEN:?Add the VERCEL_TOKEN GitHub Actions secret}"
          : "${VERCEL_ORG_ID:?Add the VERCEL_ORG_ID GitHub Actions secret}"
          : "${VERCEL_PROJECT_ID:?Add the VERCEL_PROJECT_ID GitHub Actions secret}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm check-types

      - name: Install Vercel CLI
        run: npm install --global vercel@65.0.0

      - name: Pull production project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifacts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt artifacts
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
          printf '### Production release %s\n\n[View deployment](%s)\n' "$GITHUB_REF_NAME" "$deployment_url" >> "$GITHUB_STEP_SUMMARY"
